name: HW5 Global Illumination
on:
  push:
    branches: [edidada/hw5-global-illumination]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hw5:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Fetch task tools from fixed central commit
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://github.com/edidada/cs148-labs/releases/download/hw5-tools-5ac95c6/cs148-hw5-tools-5ac95c6.zip' -o .tools.zip
          echo 'c99c45348aa741f3d46037cc66a6a03213b9349e31d8eaf9fbaab94714ac5bff  .tools.zip' | sha256sum -c -
          mkdir -p .scripts
          unzip -q .tools.zip -d .scripts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned Blender wheel
        run: |
          set -euo pipefail
          mkdir -p evidence assets .wheels
          python -m pip download --no-deps bpy==4.4.0 -d .wheels
          echo '50ee92155cdb8740214fa3b29d9a45ee90cda9dc15eb978860916de468b8580f  .wheels/bpy-4.4.0-cp311-cp311-manylinux_2_28_x86_64.whl' | sha256sum -c -
          python -m pip install numpy==2.2.6 .wheels/*.whl
          python -m pip freeze > evidence/pip-freeze.txt
          cp .scripts/provenance.json evidence/tools-provenance.json
      - name: Download official starter
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --max-time 180 'https://web.stanford.edu/class/cs148/hws/hw5/cs148-hw5-4_4.blend' -o assets/hw5-4_4.blend
          echo '0540023e22bc01ed98be39e005ba86b837225bd14762077be8f970f5f9da9995  assets/hw5-4_4.blend' | sha256sum -c -
      - name: Compare embedded Text with actual Blender API
        run: |
          set -euo pipefail
          python .scripts/py/verify_cs148_starter.py assets/hw5-4_4.blend --output evidence/starter-audit.json 2>&1 | tee evidence/starter-audit.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hw5-starter-audit
          path: |
            evidence/
            assets/hw5-4_4.blend
      - name: Numerical contracts and five controlled corruptions
        run: |
          set -euo pipefail
          python .scripts/py/run_cs148_hw5.py assets/hw5-4_4.blend --output evidence/numerical --mode verify 2>&1 | tee evidence/numerical.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hw5-numerical
          path: |
            evidence/numerical/
            evidence/numerical.log
      - name: Area light 480x480 depth3 sample1
        run: |
          set -euo pipefail
          python .scripts/py/run_cs148_hw5.py assets/hw5-4_4.blend --output evidence/area-single --mode render --stage area-single 2>&1 | tee evidence/area-single.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hw5-area-single
          path: |
            evidence/area-single/
            evidence/area-single.log
      - name: Area light 480x480 depth3 sample4
        run: |
          set -euo pipefail
          python .scripts/py/run_cs148_hw5.py assets/hw5-4_4.blend --output evidence/area-four --mode render --stage area-four 2>&1 | tee evidence/area-four.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hw5-area-four
          path: |
            evidence/area-four/
            evidence/area-four.log
      - name: Corput 480x480 depth3 sample4
        run: |
          set -euo pipefail
          python .scripts/py/run_cs148_hw5.py assets/hw5-4_4.blend --output evidence/corput-four --mode render --stage corput-four 2>&1 | tee evidence/corput-four.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hw5-corput-four
          path: |
            evidence/corput-four/
            evidence/corput-four.log
      - name: Indirect diffuse 480x480 depth3 sample16
        run: |
          set -euo pipefail
          python .scripts/py/run_cs148_hw5.py assets/hw5-4_4.blend --output evidence/indirect-sixteen --mode render --stage indirect-sixteen 2>&1 | tee evidence/indirect-sixteen.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hw5-indirect-sixteen
          path: |
            evidence/indirect-sixteen/
            evidence/indirect-sixteen.log
